[package]
name = "dmne-meme-alpha"
version = "0.7.1"
edition = "2021"

[lib]
name = "dmne_meme_alpha"
path = "src/lib.rs"

[[bin]]
name = "dmne-meme-alpha"
path = "src/main.rs"

[[bin]]
name = "sandbox_replay"
path = "src/bin/sandbox_replay.rs"

[[bin]]
name = "hawkes_sandbox"
path = "src/bin/hawkes_sandbox.rs"

[[bin]]
name = "funder_sandbox"
path = "src/bin/funder_sandbox.rs"

[[bin]]
name = "adaptive_exits_sandbox"
path = "src/bin/adaptive_exits_sandbox.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }
futures-util = "0.3"
solana-sdk = "1.18"
solana-client = "1.18"
solana-account-decoder = "1.18"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
bs58 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
toml = "0.8"
