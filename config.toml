[hawkes]
enabled = true
min_sample_size = 5                  # minimum order arrival events required for Hawkes estimation
branching_ratio_threshold = 1.15     # eta_hat threshold for supercritical wash self-excitation
decay_rate = 1.0                     # beta decay in seconds^-1
min_dispersion_threshold = 0.35      # minimum entropy required for admission
volume_override_usd = 60000.0        # high-liquidity pass-through ceiling

[dynamic_exits]
enabled = true
vol_multiplier = 1.65                # k_vol multiplier on realized tick volatility
min_trail_pct = 8.0                  # minimum trailing band width (%)
max_trail_pct = 22.0                 # maximum trailing band width (%)
mfe_activation_pct = 15.0            # peak MFE threshold to arm dynamic lock-in floor
min_locked_floor_pct = 4.0           # absolute floor guaranteed once armed

[orderflow]
enabled = true
cvd_window_secs = 60.0               # rolling window duration for volume delta calculation
min_entry_cvd_ratio = 0.15           # minimum positive taker pressure required for entry (+15%)
bearish_absorption_threshold = -0.30 # negative ratio threshold flagging passive dumping
tighten_exit_on_absorption = true    # dynamically raise exit floor if CVD divergence triggers

[genesis_guard]
enabled = true
max_genesis_supply_pct = 25.0        # max aggregate supply sniped in slot 0 (%)
max_slot0_bundled_txs = 3           # max coordinated buys in block 0
reject_shared_tip_accounts = true   # reject if multi-wallet bundle shares tip account

[funder_graph]
enabled = true
max_hops = 3
max_sybil_cluster_pct = 18.0
max_funder_hhi = 0.35
max_cluster_funding_window_secs = 300
cex_amount_tolerance_sol = 0.005
