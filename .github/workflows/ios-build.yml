name: Build Native iOS App (Apple Cloud Runner)

on:
  push:
    branches: [ master, main ]
    paths:
      - 'ios/**'
  workflow_dispatch:

jobs:
  build-ios:
    name: Compile SwiftUI App on macOS
    runs-on: macos-14  # Apple Silicon Cloud Runner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Validate Swift Code Syntax
        run: |
          cd ios/DMNEAlpha
          swiftc -typecheck DMNEAlphaApp.swift ContentView.swift DeskViewModel.swift -sdk $(xcrun --sdk iphonesimulator --show-sdk-path) -target arm64-apple-ios17.0-simulator
          echo "✅ Native SwiftUI code compiles cleanly without errors!"

